name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (default <branch>-<short sha>)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Same rule as unifi-op: a release tag publishes as itself and, unless it is an rc, moves
  # `latest`. A manual run publishes a staging tag for one commit and never touches `latest`.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == *rc* ]] && latest=false || latest=true
          else
            tag="$INPUT_TAG"
            [[ -n "$tag" ]] || tag="$GITHUB_REF_NAME-${GITHUB_SHA::8}"
            if [[ "$tag" == v* ]]; then
              echo "::error::'$tag' looks like a release tag; manual runs publish staging tags only"
              exit 1
            fi
            latest=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push tipper
    needs: resolve
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/pufferfinance/tipper
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.resolve.outputs.tag }}
            ${{ needs.resolve.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
