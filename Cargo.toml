[package]
name = "tipper"
version = "0.1.0"
edition = "2024"
description = "Tops up a list of accounts to a target balance from one funder key"
license = "MIT"

[dependencies]
alloy-network = "=2.4.2"
alloy-primitives = "1.6.1"
alloy-provider = "=2.4.2"
alloy-rpc-types = "=2.4.2"
alloy-signer-local = "=2.4.2"
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
